project: InstaAddict
version: 1.2.1
type: cli-tool
description: 'Human-like Instagram automation bot powered by ADB and UIAutomator2,
  automating interactions (following, liking, commenting, watching stories) directly
  on Android devices without private API calls.

  '
stack:
- primary: Python
- runtime: Python 3.11+ / 3.13
- automation: uiautomator2
- bridge: adb (Android Debug Bridge)
- configuration: YAML / ConfigArgParse
- data: SQLite / JSON / text lists
team: open-source
priorities:
- anti-detection
- reliability
- safety-limits
- clean-code
repo: github.com/ssucipto/instaaddict
capabilities:
- IG v446+ Full-Screen Reels & Modern Action Bar / Media group resolution
- Multi-Tier Hashtag Discovery, Rotation & Pruning Engine (HashtagManager)
- Persistent Non-Bot Followings Cache with Atomic Disk Writes
- In-App Browser & Advertisement Trapping Escape Watchdog
- Multimodal Gemini Vision AI Post Evaluation & Contextual Commenting
- Autonomous Local Queue Post & Reel Uploader (UploadPostsPlugin)
- Native 200ms ADB Flick Gestures & Fluid Single-Swipe Feed Navigation
- Self-Learning Parameter Tuning Engine (DogfoodOptimizer) & Resilient Crash Telemetry

