  - id: task-14
    name: Implement Gemini Vision AI Commenting Engine
    status: completed
    estimated_hours: 4
    notes: 'Build vision_commenter.py. Implement io.BytesIO() RAM streams, Pillow 512px compression for latency, and configure BLOCK_ONLY_HIGH API safety settings. NEW: Implement regex payload sanitizer to block "As an AI" LLM outings. Inject biometric typing delays len(text)*0.15s to bypass IG speed heuristics. NEWv3: Apply strict max_output_tokens=15. Enforce 5.0s hard HTTP timeout to prevent ATX watchdog crashes. Mandate English linguistic locks. NEWv4: Implement Global Circuit Breaker for dead APIs. Re-order execution (Screenshot BEFORE opening comment modal). Handle "Action Blocked" popups gracefully by disabling session commenting. NEWv5: Inject temperature=0.9 for creative entropy. Add raw Spacebar keyevent (62) trick to wake up React Native UI listeners. Hardcode session killswitch at 50 API calls to prevent billing traps.'
    completed_date: '2026-09-12'
  - id: task-15
    name: Implement Automated Reels Stalker
    status: completed
    estimated_hours: 3
    notes: 'Ensure bot leverages TabBarTabs.REELS, watches videos for dynamic lengths, and interacts with highly-local targets. NEW: Decouple from feed loops; treat Reels as fixed temporal blocks (random 12-35s) to simulate organic doomscrolling. NEWv3: Ensure local SQLite/JSON history logs comment idempotency. NEVER double-comment on a historically matching post ID. NEWv4: Implement UI State Hashing (Username lock). If Reel shifts during API delay, abort injection to prevent catastrophic context mismatch.'
    completed_date: '2026-09-12'
  - id: task-16
    name: Balance Configuration & Safety Limits
    status: completed
    estimated_hours: 1
    notes: Setup python-dotenv, inject .env into .gitignore, and balance interaction limits across config.yml.
    completed_date: '2026-09-12'
  milestone_6:
  - id: task-17
    name: Architect Vision-Captioning Bridge
    status: completed
    estimated_hours: 2
    notes: 'Architect Vision-Captioning Bridge. NEW: Bifurcate MIME types to handle .mp4 via genai.upload_file(). Inject a new yaml config parameter `ai-caption-persona` to allow customized dynamic system prompts. Forbid @mentions and strip markdown.'
    completed_date: '2026-09-12'
  - id: task-18
    name: Patch UploadPostsPlugin Pipeline
    status: completed
    estimated_hours: 2
    notes: Intercept the image payload in upload_posts.py. If no matching .txt caption file exists alongside the image, route the image to AI, fetch caption, and pipe it to the Android UI. Ensure regex sanitizer cleans up AI payload (stripping formatting artifacts like *) before injecting via UIAutomator2.
    completed_date: '2026-09-12'
  - id: task-19
    name: Sanitization & Safety Overrides
    status: completed
    estimated_hours: 1
    notes: Ensure fallback logic exists (empty caption) if AI fails. Implement a custom prompt config for the specific IG profile character. Respect local .txt overrides.
    completed_date: '2026-09-12'
  milestone_7:
  - id: task-20
    name: Windows File Lock Fix & Error Logger Hardening
    status: completed
    estimated_hours: 1
    completed_date: '2026-09-13'
    notes: Closed log handlers before removal in update_log_file_name to prevent Windows PermissionError, removed restrictive namespace filtering from error logger, and installed global sys.excepthook.
  - id: task-21
    name: Full State Tracking & Persistence Upgrade
    status: completed
    estimated_hours: 1
    completed_date: '2026-09-13'
    notes: Added total_crashes and upload metrics (totalUploads, successfulUploads, failedUploads, uploadHistory) to SessionState and serialized them in SessionStateEncoder.
  - id: task-22
    name: Automated Continuous Markdown History & Session Reports
    status: completed
    estimated_hours: 2
    completed_date: '2026-09-13'
    notes: Automatically writes non-overwritten session record to accounts/{username}/history.md and accounts/{username}/reports/session_{timestamp}.md at end of each run in print_full_report().
  - id: task-23
    name: Automated Dog-Feeding / Self-Learning Optimizer
    status: completed
    estimated_hours: 2
    completed_date: '2026-09-13'
    notes: Implemented InstaAddict/core/dogfood.py to parse sessions.json, history.md, and _error_trace.log, calculate conversion metrics, identify hotspots, and output automated tuning suggestions.
